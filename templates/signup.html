<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Staff Room</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FF0080, #7928CA);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        h2 {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            font-weight: normal;
        }
        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
        }
        input {
            padding: 0.75rem;
            font-size: 1rem;
            width: 100%;
            border: none;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            background-color: #FF0080;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #D10069;
        }
        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: rgba(0, 255, 0, 0.2);
        }
        .error {
            background-color: rgba(255, 0, 0, 0.2);
        }
        .login-link {
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .login-link a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sign Up</h1>
        <h2>Join Staff Room to automate your Notion workflows</h2>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
            </div>
            
            <button type="submit">Create Account</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="login-link">
            Already have an account? <a href="/">Log in</a>
        </div>
    </div>
    
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageElement = document.getElementById('message');
            
            // Clear previous messages
            messageElement.textContent = '';
            messageElement.classList.remove('success', 'error');
            messageElement.style.display = 'none';
            
            // Validate passwords match
            if (password !== confirmPassword) {
                messageElement.textContent = 'Passwords do not match';
                messageElement.classList.add('error');
                messageElement.style.display = 'block';
                return;
            }
            
            // Validate password strength (optional)
            if (password.length < 8) {
                messageElement.textContent = 'Password must be at least 8 characters long';
                messageElement.classList.add('error');
                messageElement.style.display = 'block';
                return;
            }
            
            // Submit to API
            fetch('/users/complete_signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email: email, password: password }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    messageElement.textContent = data.error;
                    messageElement.classList.add('error');
                } else {
                    messageElement.textContent = data.message + '. Redirecting to login...';
                    messageElement.classList.add('success');
                    
                    // Redirect to login page after successful signup
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                }
                messageElement.style.display = 'block';
            })
            .catch(error => {
                console.error('Error:', error);
                messageElement.textContent = 'An error occurred. Please try again.';
                messageElement.classList.add('error');
                messageElement.style.display = 'block';
            });
        });
    </script>
</html>
